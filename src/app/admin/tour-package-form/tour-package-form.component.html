<form (ngSubmit)="onSubmit()" [formGroup]="tourPackageForm" class="tour-package-form">
  <div class="form-group">
    <label for="packageName">Package Name:</label>
    <input type="text" id="packageName" formControlName="packageName" class="form-control">
  </div>

  <div class="form-group">
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description" class="form-control"></textarea>
  </div>

  <div class="form-group">
    <label for="price">Price:</label>
    <input type="number" id="price" formControlName="price" class="form-control">
  </div>

  <div class="form-group">
    <label for="durationDays">Duration (Days):</label>
    <input type="number" id="durationDays" formControlName="durationDays" class="form-control">
  </div>

  <div class="form-group">
    <label for="place">Place:</label>
    <input type="text" id="place" formControlName="place" class="form-control">
  </div>

  <button type="submit" class="btn-submit">Save</button>
</form>
