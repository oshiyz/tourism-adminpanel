<div class="travel-places-container">
  <h2>Travel Places</h2>
  <button routerLink="/travel-places/new" mat-raised-button color="primary" class="add-btn">
    Add New Travel Place
  </button>
  <div *ngIf="loading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>
  <div class="places-grid" *ngIf="!loading && !error">
    <ng-container *ngIf="travelPlaces.length > 0; else noData">
      <mat-card class="place-card" *ngFor="let place of travelPlaces">
        <mat-card-header>
          <mat-card-title>{{ place.placeName }}</mat-card-title>
          <mat-card-subtitle>{{ place.ownerName }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ place.description }}</p>
          <p><strong>Contact:</strong> {{ place.contactInfo }}</p>
          <p><strong>Location:</strong>
            <a *ngIf="place.locationLink" [href]="place.locationLink" target="_blank">View Map</a>
          </p>
        </mat-card-content>
        <mat-card-actions>
          <button
            *ngIf="place.id !== undefined"
            [routerLink]="['/travel-places/edit', place.id]"
            mat-button
          >Edit</button>
          <button
            *ngIf="place.id !== undefined"
            (click)="deleteTravelPlace(place.id!)"
            mat-button
            color="warn"
          >Delete</button>
        </mat-card-actions>
      </mat-card>
    </ng-container>
    <ng-template #noData>
      <div class="no-data">No travel places found.</div>
    </ng-template>
  </div>
</div>
